<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - Command Palette</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root{--overlay:rgba(15,23,42,.72);--panel:#111827;--row:#1F2937;--accent:#60A5FA;--purple:#A78BFA;--text:#F9FAFB;--radius:18px;--shadow:0 24px 80px rgba(0,0,0,.45);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}
.app-bg{background:#0F172A;}
.blurred{filter:blur(5px) brightness(.7);}
.overlay{background:var(--overlay);backdrop-filter:blur(4px);}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);backdrop-filter:blur(10px);}
.field{background:transparent;transition:all .18s ease-out;}
.field:focus{outline:none;}
.input-wrap{border:1px solid #1F2937;transition:all .18s ease-out;}
.input-wrap.focused{border-color:var(--accent);box-shadow:0 0 0 2px rgba(96,165,250,.45);}
.input-wrap.invalid{border-color:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.4);}
.btn-primary{background:linear-gradient(135deg,#60A5FA,#A78BFA);transition:all .18s ease-out;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none;}
.command-row:hover{background:rgba(96,165,250,.12);}
kbd{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:6px;padding:2px 7px;font-size:11px;}
.step{transition:.18s;}
.step.active{background:rgba(96,165,250,.14);border-color:var(--accent);}
.err-text{color:#f87171;}
</style>
</head>
<body class="app-bg">
<!-- blurred background app -->
<div class="blurred fixed inset-0 p-8 select-none pointer-events-none">
  <div class="flex gap-4 mb-6"><div class="w-40 h-8 rounded-lg bg-white/10"></div><div class="ml-auto w-24 h-8 rounded-lg bg-white/10"></div></div>
  <div class="grid grid-cols-4 gap-4">
    <div class="h-28 rounded-2xl bg-white/[.07]"></div><div class="h-28 rounded-2xl bg-white/[.07]"></div>
    <div class="h-28 rounded-2xl bg-white/[.07]"></div><div class="h-28 rounded-2xl bg-white/[.07]"></div>
  </div>
  <div class="mt-4 h-64 rounded-2xl bg-white/[.05]"></div>
</div>

<!-- overlay + palette -->
<div class="overlay fixed inset-0 flex items-start justify-center pt-20 px-4">
  <div class="w-full panel rounded-[18px] overflow-hidden" style="max-width:640px;">
    <!-- search header -->
    <div class="flex items-center gap-3 px-5 py-4" style="border-bottom:1px solid rgba(255,255,255,.07);">
      <i class="fa-solid fa-user-plus" style="color:var(--accent);"></i>
      <span class="text-sm mono" style="color:#94a3b8;">register</span>
      <span class="text-xs px-2 py-0.5 rounded-md mono" style="background:rgba(167,139,250,.18);color:var(--purple);">New Account</span>
      <div class="ml-auto flex items-center gap-1.5"><kbd>Esc</kbd><span class="text-xs" style="color:#64748b;">close</span></div>
    </div>

    <!-- section -->
    <div class="px-5 pt-4 pb-2 text-[11px] font-semibold tracking-wider mono" style="color:#64748b;">CREATE ACCOUNT</div>

    <form id="form" novalidate class="px-5 pb-4 space-y-3">
      <div>
        <div class="input-wrap command-row rounded-xl px-3.5 py-2.5 flex items-center gap-3" id="wname">
          <i class="fa-solid fa-user w-4 text-center" style="color:#94a3b8;"></i>
          <input id="name" type="text" class="field flex-1 text-sm placeholder:text-slate-500" placeholder="Full name" />
          <kbd class="mono">1</kbd>
        </div>
        <p class="err-text text-xs mt-1 ml-1 hidden mono" data-err></p>
      </div>
      <div>
        <div class="input-wrap command-row rounded-xl px-3.5 py-2.5 flex items-center gap-3" id="wemail">
          <i class="fa-solid fa-at w-4 text-center" style="color:#94a3b8;"></i>
          <input id="email" type="email" class="field flex-1 text-sm mono placeholder:text-slate-500" placeholder="email address" />
          <kbd class="mono">2</kbd>
        </div>
        <p class="err-text text-xs mt-1 ml-1 hidden mono" data-err></p>
      </div>
      <div>
        <div class="input-wrap command-row rounded-xl px-3.5 py-2.5 flex items-center gap-3" id="wpass">
          <i class="fa-solid fa-lock w-4 text-center" style="color:#94a3b8;"></i>
          <input id="pass" type="password" class="field flex-1 text-sm mono placeholder:text-slate-500" placeholder="password" />
          <kbd class="mono">3</kbd>
        </div>
        <p class="err-text text-xs mt-1 ml-1 hidden mono" data-err></p>
      </div>
      <div>
        <div class="input-wrap command-row rounded-xl px-3.5 py-2.5 flex items-center gap-3" id="wpass2">
          <i class="fa-solid fa-lock w-4 text-center" style="color:#94a3b8;"></i>
          <input id="pass2" type="password" class="field flex-1 text-sm mono placeholder:text-slate-500" placeholder="confirm password" />
          <kbd class="mono">4</kbd>
        </div>
        <p class="err-text text-xs mt-1 ml-1 hidden mono" data-err></p>
      </div>
      <div>
        <label class="command-row rounded-xl px-3.5 py-2.5 flex items-center gap-3 cursor-pointer text-sm" id="wterms" style="color:#cbd5e1;">
          <input id="terms" type="checkbox" class="w-4 h-4 rounded accent-[#A78BFA]" />
          <span>I accept the <a href="#" style="color:var(--accent);">Terms</a></span>
          <kbd class="mono ml-auto">Space</kbd>
        </label>
        <p class="err-text text-xs mt-1 ml-1 hidden mono" data-err></p>
      </div>

      <button id="submit" type="submit" class="btn-primary w-full rounded-xl py-3 font-semibold text-sm text-slate-900 flex items-center justify-center gap-2">
        <span id="btnText">Create Account</span>
        <i id="spin" class="fa-solid fa-circle-notch fa-spin hidden"></i>
        <kbd class="mono !border-slate-900/20 !bg-slate-900/10 text-slate-900">↵</kbd>
      </button>
      <p id="ok" class="hidden text-sm text-center font-medium rounded-xl py-2.5 mono" style="background:rgba(34,197,94,.14);color:#4ade80;"><i class="fa-solid fa-circle-check mr-1"></i> Account created</p>
    </form>

    <!-- footer -->
    <div class="px-5 py-3 flex items-center gap-4 text-xs mono" style="background:rgba(255,255,255,.02);border-top:1px solid rgba(255,255,255,.07);color:#64748b;">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> select</span>
      <a href="#" class="ml-auto" style="color:var(--accent);">Already have an account? Sign in</a>
    </div>
  </div>
</div>

<script>
const f=document.getElementById('form');
const wrapOf=el=>document.getElementById('w'+el.id);
const setErr=(el,msg)=>{const w=wrapOf(el);w.classList.add('invalid');const p=w.parentElement.querySelector('[data-err]');p.textContent=msg;p.classList.remove('hidden');};
const clr=el=>{const w=wrapOf(el);w.classList.remove('invalid');const p=w.parentElement.querySelector('[data-err]');if(p)p.classList.add('hidden');};
['name','email','pass','pass2','terms'].forEach(id=>{const el=document.getElementById(id);
  el.addEventListener('input',()=>clr(el));
  el.addEventListener('focus',()=>wrapOf(el).classList.add('focused'));
  el.addEventListener('blur',()=>wrapOf(el).classList.remove('focused'));
});
f.addEventListener('submit',e=>{
  e.preventDefault();document.getElementById('ok').classList.add('hidden');
  const name=document.getElementById('name'),email=document.getElementById('email'),pass=document.getElementById('pass'),pass2=document.getElementById('pass2'),terms=document.getElementById('terms');
  let ok=true;
  if(name.value.trim().length<3){setErr(name,'full name required');ok=false;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value)){setErr(email,'invalid email');ok=false;}
  if(pass.value.length<8){setErr(pass,'min 8 characters');ok=false;}
  if(pass2.value!==pass.value||!pass2.value){setErr(pass2,'passwords do not match');ok=false;}
  if(!terms.checked){setErr(terms,'accept the terms');ok=false;}
  if(!ok)return;
  const btn=document.getElementById('submit');btn.disabled=true;
  document.getElementById('spin').classList.remove('hidden');document.getElementById('btnText').textContent='Creating';
  setTimeout(()=>{btn.disabled=false;document.getElementById('spin').classList.add('hidden');document.getElementById('btnText').textContent='Create Account';
    document.getElementById('ok').classList.remove('hidden');f.reset();},1300);
});
</script>
</body>
</html>
