<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - Minimal Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root{--bg:#F6F8FB;--surface:#FFFFFF;--border:#E5EAF3;--accent:#4F83FF;--muted:#6B7280;--text:#111827;--radius:14px;--shadow:0 8px 24px rgba(17,24,39,.06);}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;letter-spacing:-0.01em;}
.field{border:1px solid var(--border);transition:all .18s ease-out;}
.field:focus{outline:none;border-color:#4F83FF;box-shadow:0 0 0 2px rgba(79,131,255,.45);}
.field.invalid{border-color:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.35);}
.btn-primary{background:#4F83FF;transition:all .18s ease-out;}
.btn-primary:hover{background:#3f72f0;box-shadow:0 8px 20px rgba(79,131,255,.3);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.nav-item{color:var(--muted);transition:.15s;}
.nav-item:hover{background:#F6F8FB;color:var(--text);}
.nav-item.active{background:rgba(79,131,255,.1);color:#4F83FF;font-weight:600;}
.nav-item.active i{color:#4F83FF;}
.err-text{color:#dc2626;}
</style>
</head>
<body>
<div class="min-h-screen flex">
  <!-- sidebar -->
  <aside class="hidden md:flex flex-col w-60 shrink-0 bg-white" style="border-right:1px solid var(--border);">
    <div class="h-16 flex items-center gap-2.5 px-5" style="border-bottom:1px solid var(--border);">
      <div class="w-8 h-8 rounded-lg bg-[#4F83FF] flex items-center justify-center text-white text-sm"><i class="fa-solid fa-cube"></i></div>
      <span class="font-semibold">Admin Panel</span>
    </div>
    <nav class="p-3 space-y-1 text-sm">
      <a href="#" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl"><i class="fa-solid fa-house w-5"></i> Overview</a>
      <a href="#" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl"><i class="fa-solid fa-users w-5"></i> Users</a>
      <a href="#" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-xl"><i class="fa-solid fa-user-plus w-5"></i> New User</a>
      <a href="#" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl"><i class="fa-solid fa-folder w-5"></i> Projects</a>
      <a href="#" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl"><i class="fa-solid fa-gear w-5"></i> Settings</a>
    </nav>
    <div class="mt-auto p-3">
      <div class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl" style="background:#F6F8FB;">
        <div class="w-8 h-8 rounded-full bg-[#E5EAF3] flex items-center justify-center text-xs font-semibold text-[#6B7280]">AU</div>
        <div class="text-xs"><p class="font-medium">Admin</p><p style="color:var(--muted);">admin@example.com</p></div>
      </div>
    </div>
  </aside>

  <!-- main -->
  <main class="flex-1 flex flex-col">
    <!-- topbar -->
    <header class="h-16 bg-white flex items-center justify-between px-6 shrink-0" style="border-bottom:1px solid var(--border);">
      <div>
        <h1 class="font-semibold" style="font-size:18px;">Create New User</h1>
        <p class="text-xs" style="color:var(--muted);">Users / New User</p>
      </div>
      <div class="hidden sm:flex items-center gap-2 px-3 py-2 rounded-xl text-sm" style="background:#F6F8FB;color:var(--muted);">
        <i class="fa-solid fa-magnifying-glass text-xs"></i><span>Search...</span>
      </div>
    </header>

    <!-- content -->
    <div class="flex-1 overflow-auto p-6 flex justify-center items-start">
      <div class="w-full max-w-lg bg-white rounded-2xl p-7" style="border:1px solid var(--border);box-shadow:var(--shadow);">
        <h2 class="font-semibold mb-1" style="font-size:20px;">Account Details</h2>
        <p class="text-sm mb-6" style="color:var(--muted);">Fill in the fields below for the new user.</p>

        <form id="form" novalidate class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1.5" for="name">Full Name</label>
            <input id="name" type="text" class="field w-full rounded-xl px-4 py-2.5 text-sm" placeholder="Full name" />
            <p class="err-text text-xs mt-1 hidden" data-err></p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5" for="email">Email</label>
            <input id="email" type="email" class="field w-full rounded-xl px-4 py-2.5 text-sm" placeholder="name@example.com" />
            <p class="err-text text-xs mt-1 hidden" data-err></p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1.5" for="pass">Password</label>
              <input id="pass" type="password" class="field w-full rounded-xl px-4 py-2.5 text-sm" placeholder="••••••••" />
              <p class="err-text text-xs mt-1 hidden" data-err></p>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1.5" for="pass2">Confirm Password</label>
              <input id="pass2" type="password" class="field w-full rounded-xl px-4 py-2.5 text-sm" placeholder="••••••••" />
              <p class="err-text text-xs mt-1 hidden" data-err></p>
            </div>
          </div>
          <div>
            <label class="flex items-start gap-2.5 text-sm cursor-pointer" style="color:var(--muted);">
              <input id="terms" type="checkbox" class="mt-0.5 w-4 h-4 rounded accent-[#4F83FF]" />
              <span>I accept the <a href="#" class="text-[#4F83FF] font-medium">Terms of Use</a> and the Privacy Policy.</span>
            </label>
            <p class="err-text text-xs mt-1 hidden" data-err></p>
          </div>
          <div class="flex items-center gap-3 pt-2">
            <button id="submit" type="submit" class="btn-primary rounded-xl px-5 py-2.5 text-white font-semibold text-sm flex items-center gap-2">
              <span id="btnText">Save</span><i id="spin" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
            <button type="reset" class="rounded-xl px-5 py-2.5 text-sm font-medium" style="border:1px solid var(--border);color:var(--muted);">Cancel</button>
            <span id="ok" class="hidden text-sm font-medium" style="color:#15803d;"><i class="fa-solid fa-circle-check mr-1"></i> User created.</span>
          </div>
        </form>
        <p class="text-sm mt-6 pt-5" style="color:var(--muted);border-top:1px solid var(--border);">Already have an account? <a href="#" class="text-[#4F83FF] font-semibold">Sign in</a></p>
      </div>
    </div>

    <footer class="h-9 shrink-0 bg-white flex items-center px-6 text-xs" style="border-top:1px solid var(--border);color:var(--muted);">
      <span><i class="fa-solid fa-circle text-[#10B981] text-[8px] mr-1.5"></i> System online</span>
      <span class="ml-auto">v2.4.1</span>
    </footer>
  </main>
</div>

<script>
const f=document.getElementById('form');
const setErr=(el,msg)=>{const p=el.parentElement.querySelector('[data-err]');el.classList.add('invalid');p.textContent=msg;p.classList.remove('hidden');};
const clr=el=>{const p=el.parentElement.querySelector('[data-err]');el.classList.remove('invalid');if(p)p.classList.add('hidden');};
['name','email','pass','pass2'].forEach(id=>document.getElementById(id).addEventListener('input',e=>clr(e.target)));
f.addEventListener('submit',e=>{
  e.preventDefault();document.getElementById('ok').classList.add('hidden');
  const name=document.getElementById('name'),email=document.getElementById('email'),pass=document.getElementById('pass'),pass2=document.getElementById('pass2'),terms=document.getElementById('terms');
  let ok=true;
  if(name.value.trim().length<3){setErr(name,'Please enter your full name.');ok=false;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value)){setErr(email,'Enter a valid email address.');ok=false;}
  if(pass.value.length<8){setErr(pass,'Password must be at least 8 characters.');ok=false;}
  if(pass2.value!==pass.value||!pass2.value){setErr(pass2,'Passwords do not match.');ok=false;}
  if(!terms.checked){setErr(terms,'You must accept the terms.');ok=false;}
  if(!ok)return;
  const btn=document.getElementById('submit');btn.disabled=true;
  document.getElementById('spin').classList.remove('hidden');document.getElementById('btnText').textContent='Saving';
  setTimeout(()=>{btn.disabled=false;document.getElementById('spin').classList.add('hidden');document.getElementById('btnText').textContent='Save';
    document.getElementById('ok').classList.remove('hidden');f.reset();},1300);
});
</script>
</body>
</html>
